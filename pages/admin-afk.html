<section class="admin-afk-page">

    <div class="dashboard-panel">

        <h2>
            <i class="fa-solid fa-bed"></i>
            AFK Request Management
        </h2>

        <p class="text-muted">
            Review, approve or reject submitted AFK requests.
        </p>

    </div>

    <div class="dashboard-panel">

        <div class="admin-afk-toolbar">

            <button id="afkRefreshBtn" class="admin-btn">
                <i class="fa-solid fa-rotate"></i>
                Refresh
            </button>

            <select id="afkFilter">

                <option value="all">
                    All Requests
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="approved">
                    Approved
                </option>

                <option value="rejected">
                    Rejected
                </option>

            </select>

        </div>

    </div>

    <div class="dashboard-panel">

        <table class="table table-dark table-striped" id="afkRequestTable">

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Player</th>

                    <th>ID</th>

                    <th>Reason</th>

                    <th>Weeks</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</section>
